name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          # Solo instalamos las que no dan problemas de cabeceras
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static
          vcpkg integrate install

      - name: Pre-fetch & Force Patch Magnum-Opus
        shell: pwsh
        run: |
          cargo fetch
          
          # Buscamos la carpeta de la dependencia en el checkout de Cargo
          $cargoGit = "$env:USERPROFILE\.cargo\git\checkouts"
          $targetFiles = Get-ChildItem -Path $cargoGit -Filter "opus_ffi.h" -Recurse
          
          foreach ($file in $targetFiles) {
              $dir = $file.DirectoryName
              $opusDest = Join-Path $dir "opus"
              if (!(Test-Path $opusDest)) { New-Item -ItemType Directory -Path $opusDest -Force }
              
              Write-Host "Inyectando headers en: $opusDest"
              
              # Descargamos los 4 archivos críticos directamente desde el mirror oficial de Opus
              $baseUrl = "https://raw.githubusercontent.com/xiph/opus/master/include"
              $files = @("opus.h", "opus_multistream.h", "opus_types.h", "opus_defines.h")
              
              foreach ($f in $files) {
                  $url = "$baseUrl/$f"
                  Invoke-WebRequest -Uri $url -OutFile "$opusDest/$f"
              }
              
              # Verificación rápida
              if (Test-Path "$opusDest\opus_multistream.h") {
                  Write-Host "Archivo opus_multistream.h inyectado correctamente."
              }
          }

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          # Usamos la librería opus instalada por vcpkg para el linkado final, 
          # pero los headers ya los inyectamos arriba manualmente.
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
