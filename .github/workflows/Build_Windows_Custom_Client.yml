name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          vcpkg integrate install

      - name: Fix Opus Header Structure
        shell: pwsh
        run: |
          $vcpkgInclude = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\include"
          $opusDir = Join-Path $vcpkgInclude "opus"
          
          # Crear carpeta 'opus' dentro de include
          if (!(Test-Path $opusDir)) { New-Item -ItemType Directory -Path $opusDir -Force }
          
          # Copiar todos los archivos .h que empiecen por opus a la subcarpeta
          Get-ChildItem -Path $vcpkgInclude -Filter "opus*.h" | Copy-Item -Destination $opusDir -Force
          
          Write-Host "Headers de Opus organizados en: $opusDir"

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static"
          
          # 1. Rutas para el Linker de MSVC
          $env:INCLUDE = "$vcpkgRoot\include"
          $env:LIB = "$vcpkgRoot\lib"
          
          # 2. Rutas para Bindgen (Clang) - ESTO ES LO QUE ESTABA FALLANDO
          # Añadimos la carpeta include de vcpkg como directorio de sistema para Clang
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          $env:BINDGEN_EXTRA_CLANG_ARGS = "-I$vcpkgRoot\include"
          
          # 3. Variables de RustDesk / Magnum-Opus
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $env:VCPKGRS_DYNAMIC = "0"
          
          Write-Host "Lanzando compilación con BINDGEN_EXTRA_CLANG_ARGS..."
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
