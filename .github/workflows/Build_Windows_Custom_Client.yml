name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        id: vcpkg_setup
        run: |
          # Forzamos a vcpkg a usar una ruta conocida y estática
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          vcpkg install libvpx libyuv opus
          vcpkg integrate install
          
          # Buscamos la ruta de forma agresiva
          $vcpkgRoot = (vcpkg root)
          $installedPath = Join-Path $vcpkgRoot "installed\x64-windows-static"
          
          if (Test-Path "$installedPath\include") {
              echo "VCPKG_REAL_ROOT=$installedPath" >> $env:GITHUB_ENV
              Write-Host "VCPKG encontrado en: $installedPath"
          } else {
              # Plan B: Buscar donde GitHub suele ponerlo si 'vcpkg root' falla
              $fallback = "C:\tools\vcpkg\installed\x64-windows-static"
              if (Test-Path "$fallback\include") {
                  echo "VCPKG_REAL_ROOT=$fallback" >> $env:GITHUB_ENV
              } else {
                  Write-Error "Fallo crítico: No se encuentra la carpeta include de vcpkg en ninguna ruta."
                  exit 1
              }
          }

      - name: Fix Headers and Paths
        shell: pwsh
        run: |
          $simpleInclude = "C:\vcpkg_inc"
          if (!(Test-Path $simpleInclude)) { New-Item -ItemType Directory -Path $simpleInclude -Force }
          
          # Usamos la ruta detectada en el paso anterior
          $vcpkgInclude = Join-Path $env:VCPKG_REAL_ROOT "include"
          Copy-Item -Path "$vcpkgInclude\*" -Destination $simpleInclude -Recurse -Force
          
          # Crear jerarquías requeridas por magnum-opus y scrap
          $opusDir = New-Item -ItemType Directory -Path (Join-Path $simpleInclude "opus") -Force
          $vpxDir = New-Item -ItemType Directory -Path (Join-Path $simpleInclude "vpx") -Force
          
          Get-ChildItem -Path $simpleInclude -Filter "opus*.h" | Copy-Item -Destination $opusDir -Force
          Get-ChildItem -Path $simpleInclude -Filter "vpx*.h" | Copy-Item -Destination $vpxDir -Force

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          $vcpkgLib = Join-Path $env:VCPKG_REAL_ROOT "lib"
          $simpleInclude = "C:\vcpkg_inc"
          
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvcInclude = (Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\include"
          
          $env:INCLUDE = "$simpleInclude;$msvcInclude;$env:INCLUDE"
          $env:LIB = "$vcpkgLib;$env:LIB"
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          $env:BINDGEN_EXTRA_CLANG_ARGS = "-I$simpleInclude"
          
          $env:VCPKGRS_DYNAMIC = "0"
          $env:OPUS_LIB_PATH = "$vcpkgLib"
          $env:OPUS_INCLUDE_PATH = $simpleInclude
          
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
