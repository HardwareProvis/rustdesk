name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm python -y
          curl -L https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x64/sciter.dll -o sciter.dll
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Setup vcpkg (Con FFmpeg)
        shell: pwsh
        run: |
          if (Test-Path "vcpkg.json") { Remove-Item "vcpkg.json" -Force }
          cd $env:VCPKG_ROOT
          git pull --quiet
          ./bootstrap-vcpkg.bat
          cd $env:GITHUB_WORKSPACE
          
          # Añadimos ffmpeg a la lista de instalación
          $packages = @("opus", "libvpx", "libyuv", "aom", "ffmpeg")
          foreach ($pkg in $packages) {
              vcpkg install $pkg --triplet x64-windows-static --classic
          }
          vcpkg integrate install
          echo "VCPKG_FINAL_ROOT=$env:VCPKG_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV

      - name: Fix Header Hierarchy
        shell: pwsh
        run: |
          $cleanInc = New-Item -ItemType Directory -Path "C:\v_inc" -Force
          $vcpkgInc = "$env:VCPKG_FINAL_ROOT\include"
          
          # Copiar todo el contenido de vcpkg a nuestra carpeta limpia
          Copy-Item -Path "$vcpkgInc\*" -Destination $cleanInc -Recurse -Force
          
          # Asegurar jerarquías de códecs (Opus, VPX, AOM)
          foreach ($c in @("opus", "vpx", "aom")) {
              $dir = New-Item -ItemType Directory -Path (Join-Path $cleanInc $c) -Force
              Get-ChildItem -Path $cleanInc -Filter "$c*.h" | Copy-Item -Destination $dir -Force
          }
          
          # NOTA: FFmpeg ya suele venir en carpetas (libavcodec, libavutil), 
          # no tocamos su estructura para no romper las referencias cruzadas.
          
          echo "CLEAN_INCLUDE=C:\v_inc" >> $env:GITHUB_ENV

      - name: Hardcode Config
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Official Script
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvc = (Get-ChildItem -Path "$vs\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\include"
          $sdk = "C:\Program Files (x86)\Windows Kits\10\Include"
          $ver = (Get-ChildItem -Path $sdk | Sort-Object Name -Descending | Select-Object -First 1).Name
          
          # Variables de entorno críticas para compilar C++ y Rust
          $env:INCLUDE = "$env:CLEAN_INCLUDE;$msvc;$sdk\$ver\ucrt;$sdk\$ver\shared;$sdk\$ver\um;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_FINAL_ROOT\lib;$env:LIB"
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          $env:VCPKGRS_DYNAMIC = "0"
          
          # Forzamos la reconstrucción de la UI antes del build
          python build.py --hwcodec

      - name: Final Artifact
        shell: pwsh
        run: |
          # Buscar el ejecutable generado (puede estar en target/release o raíz según build.py)
          $exe = Get-ChildItem -Filter "rustdesk.exe" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item "sciter.dll" -Destination $exe.DirectoryName
          echo "PATH_TO_UPLOAD=$($exe.FullName)" >> $env:GITHUB_ENV
          echo "DLL_TO_UPLOAD=$($exe.DirectoryName)\sciter.dll" >> $env:GITHUB_ENV

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Final-v59
          path: |
            ${{ env.PATH_TO_UPLOAD }}
            ${{ env.DLL_TO_UPLOAD }}
