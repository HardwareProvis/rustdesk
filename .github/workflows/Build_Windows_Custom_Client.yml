name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Setup vcpkg
        run: |
          # Instalación de librerías en modo clásico para evitar errores de manifiesto
          vcpkg install libvpx libyuv opus libaom --triplet x64-windows-static --classic
          vcpkg integrate install
          
          # Definimos la ruta de instalación de vcpkg para los siguientes pasos
          echo "VCPKG_ROOT_DIR=C:\vcpkg\installed\x64-windows-static" >> $env:GITHUB_ENV

      - name: Fix Headers and Paths (Aislamiento en D:)
        shell: pwsh
        run: |
          # 1. Creamos una carpeta de dependencias en el disco D: (donde está el código)
          # Esto evita el error de espacios en "Program Files" que rompe a Clang
          $vendorDir = New-Item -ItemType Directory -Path "D:\a\rustdesk\vendor" -Force
          $vcpkgInclude = "$env:VCPKG_ROOT_DIR\include"
          
          # 2. Copiamos los headers de vcpkg a la nueva ruta
          Copy-Item -Path "$vcpkgInclude\*" -Destination $vendorDir -Recurse -Force
          
          # 3. SOLUCIÓN AL ERROR DE OPUS: Crear subcarpetas requeridas por RustDesk
          # El error fatal 'opus/opus_multistream.h' ocurre por falta de esta jerarquía
          $codecs = @("opus", "vpx", "aom")
          foreach ($codec in $codecs) {
              $codecPath = New-Item -ItemType Directory -Path (Join-Object $vendorDir $codec) -Force
              Get-ChildItem -Path $vendorDir -Filter "$codec*.h" | Copy-Item -Destination $codecPath -Force
          }
          
          echo "VENDOR_PATH=$($vendorDir.FullName)" >> $env:GITHUB_ENV
          Write-Host "Jerarquías de codecs corregidas en D:\a\rustdesk\vendor"

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          # 1. Detectar SDK de Windows para evitar error de 'stdlib.h'
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvcInclude = (Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\include"
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = (Get-ChildItem -Path $sdkRoot | Sort-Object Name -Descending | Select-Object -First 1).Name
          
          $ucrtInclude = "$sdkRoot\$sdkVer\ucrt"
          $sharedInclude = "$sdkRoot\$sdkVer\shared"
          $umInclude = "$sdkRoot\$sdkVer\um"
          
          # 2. Configurar Entorno de Compilación
          # Usamos nuestra carpeta vendor en D: para evitar problemas de Clang
          $env:INCLUDE = "$env:VENDOR_PATH;$msvcInclude;$ucrtInclude;$sharedInclude;$umInclude;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_ROOT_DIR\lib;$env:LIB"
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          
          # 3. Argumentos Clang blindados (solución definitiva para stdlib.h y opus.h)
          $env:BINDGEN_EXTRA_CLANG_ARGS = "-I`"$env:VENDOR_PATH`" -I`"$msvcInclude`" -I`"$ucrtInclude`" -I`"$sharedInclude`" -I`"$umInclude`""
          
          # 4. Variables específicas de RustDesk
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKGRS_DYNAMIC = "0"
          $env:OPUS_LIB_PATH = "$env:VCPKG_ROOT_DIR\lib"
          $env:OPUS_INCLUDE_PATH = "$env:VENDOR_PATH"
          
          Write-Host "Iniciando compilación en disco D: con vendor path: $env:VENDOR_PATH"
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
