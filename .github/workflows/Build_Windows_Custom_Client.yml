name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          vcpkg integrate install

      - name: Fix Opus Header Hierarchy
        shell: pwsh
        run: |
          $vcpkgInclude = "C:\vcpkg\installed\x64-windows-static\include"
          $opusDir = Join-Path $vcpkgInclude "opus"
          if (!(Test-Path $opusDir)) { New-Item -ItemType Directory -Path $opusDir -Force }
          Get-ChildItem -Path $vcpkgInclude -Filter "opus*.h" | Copy-Item -Destination $opusDir -Force

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          # 1. Detectar automáticamente las rutas de Visual Studio (Vital para stdlib.h)
          $vsPath = &(Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe") -latest -property installationPath
          $msvcPath = Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\MSVC") | Sort-Object Name -Descending | Select-Object -First 1
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = Get-ChildItem -Path $sdkPath | Sort-Object Name -Descending | Select-Object -First 1
          
          $vcpkgRoot = "C:\vcpkg\installed\x64-windows-static"
          
          # 2. Configurar INCLUDE para MSVC y Clang
          # Añadimos las rutas de vcpkg Y las del sistema para no perder stdlib.h
          $env:INCLUDE = "$vcpkgRoot\include;" + 
                         "$($msvcPath.FullName)\include;" + 
                         "$sdkPath\$($sdkVer.Name)\ucrt;" + 
                         "$sdkPath\$($sdkVer.Name)\shared;" + 
                         "$sdkPath\$($sdkVer.Name)\um"
          
          $env:LIB = "$vcpkgRoot\lib;" + "$($msvcPath.FullName)\lib\x64"
          
          # 3. Variables para Bindgen / Clang
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          # Pasamos las rutas de inclusión a Clang explícitamente
          $env:BINDGEN_EXTRA_CLANG_ARGS = "-I$vcpkgRoot\include"
          
          # 4. Variables RustDesk
          $env:VCPKGRS_DYNAMIC = "0"
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:OPUS_LIB_PATH = "$vcpkgRoot\lib"
          $env:OPUS_INCLUDE_PATH = "$vcpkgRoot\include"
          
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
