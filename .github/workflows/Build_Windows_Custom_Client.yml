name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm python -y
          curl -L https://github.com/nicoschmitt/sciter-dll/releases/download/latest/sciter.dll -o sciter.dll
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (Test-Path "vcpkg.json") { Remove-Item "vcpkg.json" -Force }
          cd $env:VCPKG_ROOT
          git pull --quiet
          ./bootstrap-vcpkg.bat
          cd $env:GITHUB_WORKSPACE
          vcpkg install opus libvpx libyuv aom --triplet x64-windows-static
          vcpkg integrate install
          echo "VCPKG_FINAL_ROOT=$env:VCPKG_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV

      - name: Fix Header Hierarchy
        shell: pwsh
        run: |
          $cleanInc = New-Item -ItemType Directory -Path "C:\v_inc" -Force
          $vcpkgInc = "$env:VCPKG_FINAL_ROOT\include"
          Copy-Item -Path "$vcpkgInc\*" -Destination $cleanInc -Recurse -Force
          foreach ($c in @("opus", "vpx", "aom")) {
              $dir = New-Item -ItemType Directory -Path (Join-Path $cleanInc $c) -Force
              Get-ChildItem -Path $cleanInc -Filter "$c*.h" | Copy-Item -Destination $dir -Force
          }
          echo "CLEAN_INCLUDE=C:\v_inc" >> $env:GITHUB_ENV

      - name: Hardcode Custom Server Config
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          
          # Reemplazar RENDEZVOUS_SERVERS (funciona con cualquier valor actual)
          sed -i 's|pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&["${{ secrets.ID_SERVER }}"];|g' $CONFIG_FILE
          
          # Reemplazar RS_PUB_KEY (funciona con cualquier valor actual)
          sed -i 's|pub const RS_PUB_KEY: &str = ".*";|pub const RS_PUB_KEY: \&str = "${{ secrets.RS_PUB_KEY }}";|g' $CONFIG_FILE
          
          # Reemplazar get_rendezvous_server() - usa perl para multilinea
          perl -i -0777 -pe 's/(pub fn get_rendezvous_server\(\) -> String \{)[^}]*\}/\1 "${{ secrets.ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          
          # Verificar los cambios
          echo "=== Verificando configuración hardcodeada ==="
          grep -n "RENDEZVOUS_SERVERS" $CONFIG_FILE | head -3
          grep -n "RS_PUB_KEY" $CONFIG_FILE | head -3
          grep -A1 "pub fn get_rendezvous_server" $CONFIG_FILE | head -3

      - name: Generate Sciter Inline Resources
        shell: pwsh
        run: |
          # Este paso genera src/ui/inline.rs con los recursos HTML/CSS embebidos
          # Sin esto, la interfaz Sciter muestra pantalla en blanco
          python res/inline-sciter.py
          
          # Verificar que se generó correctamente
          if (Test-Path "src/ui/inline.rs") {
              Write-Host "inline.rs generado correctamente"
              $size = (Get-Item "src/ui/inline.rs").Length
              Write-Host "Tamaño: $size bytes"
          } else {
              Write-Error "Error: No se pudo generar src/ui/inline.rs"
              exit 1
          }

      - name: Build RustDesk
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvc = (Get-ChildItem -Path "$vs\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\include"
          $sdk = "C:\Program Files (x86)\Windows Kits\10\Include"
          $ver = (Get-ChildItem -Path $sdk | Sort-Object Name -Descending | Select-Object -First 1).Name
          
          $env:INCLUDE = "$env:CLEAN_INCLUDE;$msvc;$sdk\$ver\ucrt;$sdk\$ver\shared;$sdk\$ver\um;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_FINAL_ROOT\lib;$env:LIB"
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          $env:VCPKGRS_DYNAMIC = "0"
          
          # Compilar con la feature 'inline' para embeber los recursos de Sciter
          cargo build --release --features inline

      - name: Organize Artifacts
        shell: pwsh
        run: |
          $outDir = "release_files"
          if (!(Test-Path $outDir)) { New-Item -ItemType Directory -Path $outDir }
          
          # Copiar el binario principal
          $exe = "target\release\rustdesk.exe"
          if (Test-Path $exe) {
              Copy-Item $exe -Destination "$outDir\rustdesk.exe"
              Copy-Item "sciter.dll" -Destination "$outDir\sciter.dll"
              Write-Host "Binario y sciter.dll copiados a $outDir"
          } else {
              Write-Error "No se encontró el ejecutable rustdesk.exe en target/release"
              Get-ChildItem -Path "target\release" -Filter "*.exe" | ForEach-Object { Write-Host $_.Name }
              exit 1
          }

      - name: Upload Final Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: release_files/
