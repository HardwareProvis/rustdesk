name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Setup vcpkg (Ruta Forzada y Update)
        shell: pwsh
        run: |
          # 1. Eliminar manifiesto para evitar conflictos
          if (Test-Path "vcpkg.json") { Remove-Item "vcpkg.json" -Force }
          
          # 2. Intentar actualizar el registro de vcpkg
          cd C:\vcpkg
          git pull --quiet
          cd $env:GITHUB_WORKSPACE
          
          # 3. Crear ruta propia
          $myVcpkg = New-Item -ItemType Directory -Path "D:\vcpkg_local" -Force
          
          # 4. Instalar codecs (Probamos 'aom' que es el nombre común en versiones nuevas)
          # Usamos try/catch para que si uno falla no detenga todo el proceso de vcpkg
          vcpkg install libvpx libyuv opus aom --triplet x64-windows-static --classic --x-install-root="$myVcpkg"
          
          $installedPath = "D:\vcpkg_local\x64-windows-static"
          echo "VCPKG_FINAL_ROOT=$installedPath" >> $env:GITHUB_ENV

      - name: Fix Header Hierarchy
        shell: pwsh
        run: |
          $cleanInc = New-Item -ItemType Directory -Path "C:\v_inc" -Force
          $vcpkgInc = "$env:VCPKG_FINAL_ROOT\include"
          
          if (Test-Path $vcpkgInc) {
              Copy-Item -Path "$vcpkgInc\*" -Destination $cleanInc -Recurse -Force
          }
          
          # Crear subcarpetas (jerarquía opus/ vpx/ aom/)
          foreach ($c in @("opus", "vpx", "aom")) {
              $dir = New-Item -ItemType Directory -Path (Join-Path $cleanInc $c) -Force
              if (Test-Path $cleanInc) {
                  Get-ChildItem -Path $cleanInc -Filter "$c*.h" | Copy-Item -Destination $dir -Force
              }
          }
          echo "CLEAN_INCLUDE=C:\v_inc" >> $env:GITHUB_ENV

      - name: Hardcode Config
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build RustDesk
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvc = (Get-ChildItem -Path "$vs\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\include"
          $sdk = "C:\Program Files (x86)\Windows Kits\10\Include"
          $ver = (Get-ChildItem -Path $sdk | Sort-Object Name -Descending | Select-Object -First 1).Name
          
          $env:INCLUDE = "$env:CLEAN_INCLUDE;$msvc;$sdk\$ver\ucrt;$sdk\$ver\shared;$sdk\$ver\um;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_FINAL_ROOT\lib;$env:LIB"
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          $env:BINDGEN_EXTRA_CLANG_ARGS = "-I`"$env:CLEAN_INCLUDE`" -I`"$msvc`" -I`"$sdk\$ver\ucrt`" -I`"$sdk\$ver\shared`" -I`"$sdk\$ver\um`""
          
          $env:VCPKGRS_DYNAMIC = "0"
          $env:OPUS_LIB_PATH = "$env:VCPKG_FINAL_ROOT\lib"
          $env:OPUS_INCLUDE_PATH = "$env:CLEAN_INCLUDE"
          
          cargo build --release --bin rustdesk --features inline

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom
          path: target/release/rustdesk.exe
