name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          vcpkg install libvpx libyuv opus --triplet x64-windows-static --classic
          vcpkg integrate install
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_REAL_ROOT=C:\vcpkg\installed\x64-windows-static" >> $env:GITHUB_ENV

      - name: Fix Headers and Paths
        shell: pwsh
        run: |
          $simpleInclude = "C:\vcpkg_inc"
          if (!(Test-Path $simpleInclude)) { New-Item -ItemType Directory -Path $simpleInclude -Force }
          $vcpkgInclude = "C:\vcpkg\installed\x64-windows-static\include"
          if (Test-Path $vcpkgInclude) { Copy-Item -Path "$vcpkgInclude\*" -Destination $simpleInclude -Recurse -Force }
          $null = New-Item -ItemType Directory -Path "$simpleInclude\opus" -Force
          $null = New-Item -ItemType Directory -Path "$simpleInclude\vpx" -Force
          Get-ChildItem -Path $simpleInclude -Filter "opus*.h" | Copy-Item -Destination "$simpleInclude\opus" -Force
          Get-ChildItem -Path $simpleInclude -Filter "vpx*.h" | Copy-Item -Destination "$simpleInclude\vpx" -Force

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          # 1. Detectar rutas del SDK de Windows y MSVC dinámicamente
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvcInclude = (Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\include"
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = (Get-ChildItem -Path $sdkRoot | Sort-Object Name -Descending | Select-Object -First 1).Name
          
          # Rutas necesarias para que Clang encuentre stdlib.h
          $ucrtInclude = "$sdkRoot\$sdkVer\ucrt"
          $sharedInclude = "$sdkRoot\$sdkVer\shared"
          $umInclude = "$sdkRoot\$sdkVer\um"
          $simpleInclude = "C:\vcpkg_inc"
          
          # 2. Configurar variables de entorno
          $env:INCLUDE = "$simpleInclude;$msvcInclude;$ucrtInclude;$sharedInclude;$umInclude;$env:INCLUDE"
          $env:LIB = "C:\vcpkg\installed\x64-windows-static\lib;$env:LIB"
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          
          # 3. Pasar TODAS las rutas a Clang (esto soluciona el error fatal: 'stdlib.h' file not found)
          $env:BINDGEN_EXTRA_CLANG_ARGS = "-I`"$simpleInclude`" -I`"$msvcInclude`" -I`"$ucrtInclude`" -I`"$sharedInclude`" -I`"$umInclude`""
          
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKGRS_DYNAMIC = "0"
          $env:OPUS_LIB_PATH = "C:\vcpkg\installed\x64-windows-static\lib"
          $env:OPUS_INCLUDE_PATH = $simpleInclude
          
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
