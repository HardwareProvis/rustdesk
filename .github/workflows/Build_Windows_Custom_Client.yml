name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          vcpkg integrate install

      - name: Fix Opus Header Structure
        shell: pwsh
        run: |
          # El error ocurre porque magnum-opus busca <opus/header.h>
          # vcpkg pone los headers en la raíz de /include, así que creamos la subcarpeta 'opus'
          $includeDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\include"
          $opusDir = Join-Path $includeDir "opus"
          
          if (!(Test-Path $opusDir)) { 
              New-Item -ItemType Directory -Path $opusDir -Force 
          }
          
          # Copiamos todos los headers de opus a la subcarpeta requerida
          Copy-Item -Path (Join-Path $includeDir "opus*.h") -Destination $opusDir -Force
          Write-Host "Estructura de directorios de Opus corregida para bindgen."

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          # Reemplazo de servidores predeterminados
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          
          # Forzar los métodos para que devuelvan tu servidor directamente
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          # Variables para que el compilador encuentre LLVM y las librerías de vcpkg
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          
          # CPATH ayuda a bindgen a encontrar los headers corregidos en el paso anterior
          $env:CPATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\include"
          
          Write-Host "Iniciando compilación de RustDesk..."
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
