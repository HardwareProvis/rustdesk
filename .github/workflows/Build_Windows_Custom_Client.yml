name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          # Solo instalamos para que el linker tenga los archivos .lib al final
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          vcpkg integrate install

      - name: Pre-fetch & Force-Inject Opus Headers
        shell: pwsh
        run: |
          cargo fetch
          
          # 1. Localizar la carpeta de la dependencia magnum-opus
          $cargoGit = "$env:USERPROFILE\.cargo\git\checkouts"
          $targetFiles = Get-ChildItem -Path $cargoGit -Filter "opus_ffi.h" -Recurse
          
          # URL corregida (usando el mirror de RustDesk que es el que magnum-opus espera)
          $baseUrl = "https://raw.githubusercontent.com/rustdesk-org/magnum-opus/main/opus_headers"
          $files = @("opus.h", "opus_multistream.h", "opus_types.h", "opus_defines.h")
          
          foreach ($file in $targetFiles) {
              $dir = $file.DirectoryName
              Write-Host "Inyectando headers en: $dir"
              
              # Crear subcarpeta 'opus' (lo que pide el error de 'opus/opus_multistream.h')
              $opusSubDir = Join-Path $dir "opus"
              if (!(Test-Path $opusSubDir)) { New-Item -ItemType Directory -Path $opusSubDir -Force }
              
              foreach ($f in $files) {
                  $dest = Join-Path $opusSubDir $f
                  Write-Host "Descargando $f..."
                  Invoke-WebRequest -Uri "$baseUrl/$f" -OutFile $dest -UseBasicParsing
                  # Copiar también a la raíz de la dependencia por si acaso
                  Copy-Item $dest -Destination (Join-Path $dir $f) -Force
              }
          }

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          # Forzamos la variable que hizo fallar el intento anterior
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          
          # Ignoramos vcpkg para los headers, ya los inyectamos arriba.
          # Pero necesitamos las librerías para el linkado.
          $vcpkgLib = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib"
          $env:OPUS_LIB_PATH = $vcpkgLib
          $env:LIBVPX_LIB_PATH = $vcpkgLib
          
          Write-Host "Iniciando compilación final..."
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
