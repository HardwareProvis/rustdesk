name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg & Hard-Fix Opus
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          vcpkg integrate install
          
          # 1. Localizar dónde instaló vcpkg los headers
          $VCPKG_INC = "C:\vcpkg\installed\x64-windows-static\include"
          
          # 2. TRUCO FINAL: Buscamos la carpeta de caché donde Rust baja 'magnum-opus'
          # y metemos los archivos ahí directamente.
          $CARGO_GIT = "$env:USERPROFILE\.cargo\git\checkouts"
          # Esperamos a que existan los directorios o los forzamos
          if (Test-Path $CARGO_GIT) {
              $magnum_dirs = Get-ChildItem -Path $CARGO_GIT -Filter "magnum-opus*" -Recurse -Directory
              foreach ($d in $magnum_dirs) {
                  $dest = Join-Path $d.FullName "opus"
                  if (!(Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force }
                  Copy-Item "$VCPKG_INC\*.h" $dest -Force
                  echo "Parche aplicado en: $dest"
              }
          }

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_INSTALLED = "C:\vcpkg\installed\x64-windows-static"
          $env:LIBVPX_LIB_PATH = "$env:VCPKG_INSTALLED\lib"
          $env:LIBVPX_INCLUDE_PATH = "$env:VCPKG_INSTALLED\include"
          $env:OPUS_LIB_PATH = "$env:VCPKG_INSTALLED\lib"
          $env:OPUS_INCLUDE_PATH = "$env:VCPKG_INSTALLED\include"
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          
          # Forzamos la inclusión en el compilador de C
          $env:CPATH = "$env:VCPKG_INSTALLED\include"
          $env:INCLUDE = "$env:VCPKG_INSTALLED\include"
          
          # El comando de build
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
