name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          vcpkg integrate install

      - name: Pre-fetch & Patch Magnum-Opus
        run: |
          cargo fetch
          
          # DETECCIÓN DINÁMICA DE VCPKG
          # Obtenemos la ruta del ejecutable y subimos niveles para hallar la raíz
          $vcpkgExe = (Get-Command vcpkg).Source
          $vcpkgRoot = Split-Path (Split-Path $vcpkgExe -Parent) -Parent
          
          # Buscamos la carpeta de include de forma recursiva bajo la raíz hallada
          $vcpkgInclude = Get-ChildItem -Path $vcpkgRoot -Filter "opus.h" -Recurse | 
                          Where-Object { $_.FullName -like "*x64-windows-static*" } | 
                          Select-Object -First 1 -ExpandProperty DirectoryName

          if (-not $vcpkgInclude) {
              Write-Error "No se pudo encontrar la carpeta de cabeceras de Opus en $vcpkgRoot"
              exit 1
          }

          Write-Host "Ruta de headers detectada: $vcpkgInclude"

          $cargoGit = "$env:USERPROFILE\.cargo\git\checkouts"
          $targetFiles = Get-ChildItem -Path $cargoGit -Filter "opus_ffi.h" -Recurse
          
          foreach ($file in $targetFiles) {
              $dir = $file.DirectoryName
              $opusDir = Join-Path $dir "opus"
              if (!(Test-Path $opusDir)) { New-Item -ItemType Directory -Path $opusDir -Force }
              
              # Copiamos los archivos .h a la carpeta del checkout
              Copy-Item "$vcpkgInclude\*.h" $opusDir -Force
              Write-Host "Parcheado con éxito en: $opusDir"
          }

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          # Re-detectamos la ruta para las variables de entorno del build
          $vcpkgExe = (Get-Command vcpkg).Source
          $vcpkgRoot = Split-Path (Split-Path $vcpkgExe -Parent) -Parent
          $vcpkgInstalled = Get-ChildItem -Path $vcpkgRoot -Name "x64-windows-static" -Recurse -Directory | Select-Object -First 1 -ExpandProperty FullName

          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          $env:VCPKG_ROOT = $vcpkgRoot
          
          $env:LIBVPX_LIB_PATH = "$vcpkgInstalled\lib"
          $env:LIBVPX_INCLUDE_PATH = "$vcpkgInstalled\include"
          $env:OPUS_LIB_PATH = "$vcpkgInstalled\lib"
          $env:OPUS_INCLUDE_PATH = "$vcpkgInstalled\include"
          $env:INCLUDE = "$vcpkgInstalled\include"
          
          cargo build --release --bin rustdesk --features inline --offline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
