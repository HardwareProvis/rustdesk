name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NASM & LLVM
        run: |
          choco install nasm llvm -y
          # Forzamos a que LLVM esté en el PATH del sistema
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (v1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg & Fix Opus
        run: |
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          vcpkg install libvpx libyuv opus
          vcpkg integrate install
          
          # SOLUCIÓN DEFINITIVA AL ERROR DE CABECERAS:
          # magnum-opus busca <opus/opus_multistream.h>. 
          # Creamos la ruta física y aseguramos que los archivos estén ahí.
          $INC = "C:\vcpkg\installed\x64-windows-static\include"
          if (!(Test-Path "$INC\opus")) { New-Item -ItemType Directory -Path "$INC\opus" -Force }
          Copy-Item "$INC\*.h" "$INC\opus\" -ErrorAction SilentlyContinue
          
          # Verificar que el archivo existe (esto saldrá en el log para confirmar)
          if (Test-Path "$INC\opus\opus_multistream.h") { echo "Opus Headers corregidos con éxito" }

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          # Inyectar tus Secrets
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          
          # Overrides totales de funciones
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_INSTALLED = "$env:VCPKG_ROOT\installed\x64-windows-static"
          
          # Variables de entorno para Rust
          $env:LIBVPX_LIB_PATH = "$env:VCPKG_INSTALLED\lib"
          $env:LIBVPX_INCLUDE_PATH = "$env:VCPKG_INSTALLED\include"
          $env:OPUS_LIB_PATH = "$env:VCPKG_INSTALLED\lib"
          $env:OPUS_INCLUDE_PATH = "$env:VCPKG_INSTALLED\include"
          
          # VARIABLES CRÍTICAS PARA BINDGEN/MAGNUM-OPUS
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          # CPATH y las variables de INCLUDE son las que lee el compilador de C directo
          $env:CPATH = "$env:VCPKG_INSTALLED\include"
          $env:INCLUDE = "$env:VCPKG_INSTALLED\include"
          
          # Compilar usando el flag oficial
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
