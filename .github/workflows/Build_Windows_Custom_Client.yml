name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          vcpkg integrate install

      - name: Fix Opus Header Hierarchy
        shell: pwsh
        run: |
          $vcpkgInclude = "C:\vcpkg\installed\x64-windows-static\include"
          $opusDir = Join-Path $vcpkgInclude "opus"
          if (!(Test-Path $opusDir)) { New-Item -ItemType Directory -Path $opusDir -Force }
          # Copiamos los headers para que 'opus/opus.h' sea válido
          Get-ChildItem -Path $vcpkgInclude -Filter "opus*.h" | Copy-Item -Destination $opusDir -Force

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          # 1. LOCALIZACIÓN DINÁMICA DE SDK Y MSVC (Para evitar error de stdlib.h)
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvcInclude = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          $sdkIncludeRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = Get-ChildItem -Path $sdkIncludeRoot | Sort-Object Name -Descending | Select-Object -First 1
          
          $vcpkgRoot = "C:\vcpkg\installed\x64-windows-static"
          $vcpkgInclude = "$vcpkgRoot\include"
          
          # 2. CONSTRUCCIÓN DE RUTAS DE INCLUSIÓN
          # Combinamos vcpkg + MSVC + Windows SDK (UCRT, Shared, UM)
          $paths = @(
            $vcpkgInclude,
            "$($msvcInclude.FullName)\include",
            "$sdkIncludeRoot\$($sdkVer.Name)\ucrt",
            "$sdkIncludeRoot\$($sdkVer.Name)\shared",
            "$sdkIncludeRoot\$($sdkVer.Name)\um"
          )
          $env:INCLUDE = ($paths -join ";") + ";" + $env:INCLUDE
          
          # 3. VARIABLES PARA CLANG/BINDGEN
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          # Pasamos todas las rutas de inclusión a Clang para que encuentre stdlib.h y opus/
          $env:BINDGEN_EXTRA_CLANG_ARGS = ($paths | ForEach-Object { "-I$_" }) -join " "
          
          # 4. VARIABLES RUSTDESK
          $env:VCPKGRS_DYNAMIC = "0"
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:OPUS_LIB_PATH = "$vcpkgRoot\lib"
          $env:OPUS_INCLUDE_PATH = $vcpkgInclude
          
          Write-Host "Rutas de inclusión configuradas: $env:INCLUDE"
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
