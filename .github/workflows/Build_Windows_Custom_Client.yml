name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          vcpkg integrate install

      - name: Fix Library Header Hierarchy
        shell: pwsh
        run: |
          $vcpkgInclude = "C:\vcpkg\installed\x64-windows-static\include"
          
          # Fix para Opus
          $opusDir = Join-Path $vcpkgInclude "opus"
          if (!(Test-Path $opusDir)) { New-Item -ItemType Directory -Path $opusDir -Force }
          Get-ChildItem -Path $vcpkgInclude -Filter "opus*.h" | Copy-Item -Destination $opusDir -Force
          
          # Fix para VPX (Evita el error vpx/vp8.h not found)
          $vpxDir = Join-Path $vcpkgInclude "vpx"
          if (!(Test-Path $vpxDir)) { New-Item -ItemType Directory -Path $vpxDir -Force }
          Get-ChildItem -Path $vcpkgInclude -Filter "vpx*.h" | Copy-Item -Destination $vpxDir -Force
          
          Write-Host "Jerarquía de cabeceras corregida para Opus y VPX."

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          # 1. Localización de rutas
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvcInclude = (Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\include"
          $sdkIncludeRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = (Get-ChildItem -Path $sdkIncludeRoot | Sort-Object Name -Descending | Select-Object -First 1).Name
          
          $vcpkgRoot = "C:\vcpkg\installed\x64-windows-static"
          $vcpkgInclude = "$vcpkgRoot\include"
          
          # 2. Configurar INCLUDE (formato estándar de Windows con comillas si hay espacios)
          $env:INCLUDE = "$vcpkgInclude;$msvcInclude;$sdkIncludeRoot\$sdkVer\ucrt;$sdkIncludeRoot\$sdkVer\shared;$sdkIncludeRoot\$sdkVer\um"
          $env:LIB = "$vcpkgRoot\lib"
          
          # 3. VARIABLES PARA CLANG/BINDGEN (Crucial: Usar comillas escapadas para rutas con espacios)
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          
          # Construimos los argumentos de Clang envolviendo cada ruta en comillas dobles
          $clangArgs = @(
            "-I`"$vcpkgInclude`"",
            "-I`"$msvcInclude`"",
            "-I`"$sdkIncludeRoot\$sdkVer\ucrt`"",
            "-I`"$sdkIncludeRoot\$sdkVer\shared`"",
            "-I`"$sdkIncludeRoot\$sdkVer\um`""
          )
          $env:BINDGEN_EXTRA_CLANG_ARGS = $clangArgs -join " "
          
          # 4. Variables RustDesk
          $env:VCPKGRS_DYNAMIC = "0"
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:OPUS_LIB_PATH = "$vcpkgRoot\lib"
          $env:OPUS_INCLUDE_PATH = $vcpkgInclude
          
          Write-Host "Clang Args: $env:BINDGEN_EXTRA_CLANG_ARGS"
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
