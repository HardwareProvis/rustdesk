name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Actualizado a v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install vcpkg dependencies
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          
          # Cambiar constantes básicas
          sed -i 's/&\["rs-ny.rustdesk.com"\]/&["${{ secrets.MY_ID_SERVER }}"]/g' $CONFIG_FILE
          sed -i 's/pub const RS_PUB_KEY: \&str = ".*";/pub const RS_PUB_KEY: \&str = "${{ secrets.MY_PUBLIC_KEY }}";/g' $CONFIG_FILE

          # Hard Override de la función get_rendezvous_server
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\n    \}/pub fn get_rendezvous_server() -> String {\n        "${{ secrets.MY_ID_SERVER }}:21116".to_string()\n    }/gs' $CONFIG_FILE

          # Hard Override de la función get_relay_server
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\n    \}/pub fn get_relay_server() -> String {\n        "${{ secrets.MY_RELAY_SERVER }}:21117".to_string()\n    }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: bash
        run: |
          export VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT
          cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4 # <--- AQUÍ ESTÁ EL CAMBIO A V4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
