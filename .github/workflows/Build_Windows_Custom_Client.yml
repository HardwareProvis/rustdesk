name: Build Windows Custom Client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          choco install nasm llvm -y
          # Añadir LLVM al PATH es vital para que bindgen encuentre libclang
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install Rust (1.75)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          vcpkg integrate install

      - name: Fix Opus Header Hierarchy
        shell: pwsh
        run: |
          $vcpkgInclude = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\include"
          $opusDir = Join-Path $vcpkgInclude "opus"
          
          # Crear la carpeta 'opus' dentro de include para satisfacer el include <opus/xxx.h>
          if (!(Test-Path $opusDir)) { 
              New-Item -ItemType Directory -Path $opusDir -Force 
          }
          
          # Copiamos todos los headers de opus a la subcarpeta. 
          # Esto soluciona el error "opus/opus_multistream.h not found"
          Get-ChildItem -Path $vcpkgInclude -Filter "opus*.h" | Copy-Item -Destination $opusDir -Force
          
          Write-Host "Headers de Opus organizados en: $opusDir"
          Get-ChildItem $opusDir | Select-Object Name

      - name: Hardcode Custom Configuration
        shell: bash
        run: |
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          # Reemplazo de servidores e inyección de Key
          sed -i "s|&\[\"rs-ny.rustdesk.com\"\]|&[\"${{ secrets.MY_ID_SERVER }}\"]|g" $CONFIG_FILE
          sed -i "s|pub const RS_PUB_KEY: \&str = \".*\";|pub const RS_PUB_KEY: \&str = \"${{ secrets.MY_PUBLIC_KEY }}\";|g" $CONFIG_FILE
          
          # Forzar retorno de funciones de servidor para que ignoren la configuración de la UI
          perl -i -0777 -pe 's/pub fn get_rendezvous_server\(\) -> String \{.*?\}/pub fn get_rendezvous_server() -> String { "${{ secrets.MY_ID_SERVER }}:21116".to_string() }/gs' $CONFIG_FILE
          perl -i -0777 -pe 's/pub fn get_relay_server\(\) -> String \{.*?\}/pub fn get_relay_server() -> String { "${{ secrets.MY_RELAY_SERVER }}:21117".to_string() }/gs' $CONFIG_FILE

      - name: Build with Cargo
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static"
          $vcpkgInclude = "$vcpkgRoot\include"
          
          # 1. Variables para el compilador de C++ (MSVC)
          $env:INCLUDE = $vcpkgInclude
          $env:LIB = "$vcpkgRoot\lib"
          
          # 2. Variables para Bindgen (Clang) - IMPORTANTE PARA MAGNUM-OPUS
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          # CPATH ayuda a Clang a encontrar la carpeta de cabeceras de vcpkg
          $env:CPATH = $vcpkgInclude
          $env:BINDGEN_EXTRA_CLANG_ARGS = "-I$vcpkgInclude"
          
          # 3. Variables específicas de RustDesk / Vcpkg-rs
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $env:VCPKGRS_DYNAMIC = "0"
          
          # 4. Forzar rutas para el linker de Opus
          $env:OPUS_LIB_PATH = "$vcpkgRoot\lib"
          $env:OPUS_INCLUDE_PATH = $vcpkgInclude
          
          Write-Host "Iniciando compilación de RustDesk (esto puede tardar)..."
          cargo build --release --bin rustdesk --features inline

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: target/release/rustdesk.exe
